# Build/test only; upstream tag publishing has been disabled until staging passes.
name: ZiloMentor Pro checks
on:
  push:
    branches:
      - zilomentor/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static source and packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run compatibility checks
        run: python3 tests/static_compatibility.py
      - name: Validate distribution packaging
        run: python3 tools/build_zip.py

  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          coverage: none
      - name: Lint all bundled PHP sources
        run: python3 tests/php_lint.py
